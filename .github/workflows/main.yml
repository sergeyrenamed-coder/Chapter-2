name: Build Cursed Quest Part II

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: cursedquest-part2-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
